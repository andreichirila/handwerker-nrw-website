name: Security scan (temporär)

# Einmaliger, manuell gestarteter Port-/TLS-Check des eigenen netcup-Webhostings.
# Wird nach der Auswertung wieder entfernt.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOMAIN: tschudnow-handwerk.de
      IP4: 202.61.233.144
      IP6: 2a03:4000:6d:3b6c::25:4728
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nmap sslscan >/dev/null
          git clone --depth 1 https://github.com/testssl/testssl.sh.git /tmp/testssl

      - name: nmap IPv4 (top 1000 TCP, Versionen)
        run: sudo nmap -Pn -sV -T3 --top-ports 1000 --reason "$IP4"

      - name: nmap IPv6
        continue-on-error: true
        run: |
          if ping -6 -c1 -W3 "$IP6" >/dev/null 2>&1 || curl -6 -s -m 8 -o /dev/null "https://[$IP6]/" -k; then
            sudo nmap -6 -Pn -sV -T3 --top-ports 1000 --reason "$IP6"
          else
            echo "Runner hat keine IPv6-Konnektivität - IPv6-Scan übersprungen"
          fi

      - name: TLS auf Mail-/FTP-Ports (STARTTLS / implizit)
        continue-on-error: true
        run: |
          for spec in "21 ftp" "25 smtp" "587 smtp" "110 pop3" "143 imap"; do
            set -- $spec
            echo "=== Port $1 STARTTLS $2"
            timeout 15 openssl s_client -connect "$DOMAIN:$1" -starttls "$2" -servername "$DOMAIN" </dev/null 2>&1 | grep -E "^(subject|issuer)=|Protocol|Cipher is|Verify return code|connect:errno|didn't found|error" | head -8 || true
          done
          for p in 465 993 995 8443 8880 990; do
            echo "=== Port $p (implizites TLS)"
            timeout 15 openssl s_client -connect "$DOMAIN:$p" -servername "$DOMAIN" </dev/null 2>&1 | grep -E "^(subject|issuer)=|Protocol|Cipher is|Verify return code|connect:errno|error" | head -8 || true
          done

      - name: sslscan 443
        continue-on-error: true
        run: sslscan --no-colour "$DOMAIN:443"

      - name: testssl.sh 443
        continue-on-error: true
        run: /tmp/testssl/testssl.sh --quiet --color 0 --warnings off --fast "$DOMAIN"
