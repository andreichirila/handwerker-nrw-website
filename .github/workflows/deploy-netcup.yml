name: Deploy to netcup

# Veröffentlicht die statische Seite per SSH (tar, das Webhosting hat kein rsync) auf das netcup Webhosting.
# GitHub Pages (Vorschau) läuft unabhängig davon weiter.
#
# Benötigte Repository-Secrets:
#   NETCUP_SSH_KEY       privater Deploy-Schlüssel (ed25519, ohne Passphrase)
#   NETCUP_HOST          z. B. hosting254728.ae990.netcup.net
#   NETCUP_USER          z. B. hosting254728
#   NETCUP_PATH          Document Root(s) relativ zum Home, durch Leerzeichen getrennt,
#                        z. B. tschudnow-handwerk.de/httpdocs/
#   NETCUP_KNOWN_HOSTS   Ausgabe von ssh-keyscan für NETCUP_HOST
# Repository-Variable:
#   NETCUP_DEPLOY_ENABLED = true   aktiviert das automatische Deployment bei Push auf main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy = Seite hochladen, check = nur Verbindung/Verzeichnisse prüfen"
        type: choice
        options: [deploy, check]
        default: deploy

concurrency:
  group: deploy-netcup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.NETCUP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: netcup
      url: https://tschudnow-handwerk.de/
    env:
      MODE: ${{ github.event.inputs.mode || 'deploy' }}
      NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
      NETCUP_USER: ${{ secrets.NETCUP_USER }}
      NETCUP_PATH: ${{ secrets.NETCUP_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          NETCUP_SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          NETCUP_KNOWN_HOSTS: ${{ secrets.NETCUP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_HOST" && test -n "$NETCUP_USER" || { echo "::error::NETCUP_HOST/NETCUP_USER fehlen"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$NETCUP_KNOWN_HOSTS" ]; then
            printf '%s\n' "$NETCUP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          elif [ "$MODE" = "check" ]; then
            echo "NETCUP_KNOWN_HOSTS fehlt - Host-Schlüssel (nur für check-Modus):"
            ssh-keyscan -T 15 "$NETCUP_HOST" 2>/dev/null | tee ~/.ssh/known_hosts
            ssh-keygen -lf ~/.ssh/known_hosts
          else
            echo "::error::NETCUP_KNOWN_HOSTS fehlt"; exit 1
          fi
          chmod 600 ~/.ssh/known_hosts
          if [ -n "$NETCUP_SSH_KEY" ]; then
            printf '%s\n' "$NETCUP_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
          fi
          cat > ~/.ssh/config <<CFG
          Host netcup
            HostName $NETCUP_HOST
            User $NETCUP_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
          CFG

      - name: Check connection
        run: |
          set -euo pipefail
          ssh netcup 'echo "Login OK als $(whoami)"; echo "Home: $HOME"; ls -la ~; for t in rsync tar find sha256sum md5sum; do printf "%s: " $t; command -v $t || echo fehlt; done'
          for p in $NETCUP_PATH; do
            echo "--- Document Root: $p"
            ssh netcup "ls -la ~/${p%/}/ | head -40" || { echo "::error::Document Root $p nicht gefunden"; exit 1; }
          done

      - name: PHP syntax check
        if: env.MODE == 'deploy'
        run: php -l kontakt.php

      - name: Build site bundle
        if: env.MODE == 'deploy'
        run: |
          set -euo pipefail
          # Nur die Dateien der Website in _site/ sammeln (lokal auf dem Runner).
          rsync -a \
            --include='/index.html' \
            --include='/kontakt.php' \
            --include='/impressum.html' \
            --include='/datenschutz.html' \
            --include='/404.html' \
            --include='/.htaccess' \
            --include='/robots.txt' \
            --include='/sitemap.xml' \
            --include='/assets/***' \
            --exclude='/images/README.md' \
            --exclude='.gitkeep' \
            --include='/images/***' \
            --exclude='*' \
            ./ _site/
          (cd _site && find . -type f | sed 's|^\./||' | LC_ALL=C sort > .deploy-manifest)
          echo "Dateien im Paket: $(wc -l < _site/.deploy-manifest)"

      - name: Deploy (tar over SSH)
        if: env.MODE == 'deploy'
        run: |
          set -euo pipefail
          test -n "$NETCUP_PATH" || { echo "::error::NETCUP_PATH fehlt"; exit 1; }
          # Auf dem netcup-Webhosting gibt es kein rsync. Deshalb: Paket per tar über SSH entpacken
          # und anschließend nur die Dateien löschen, die beim letzten Deploy von uns kamen und jetzt
          # nicht mehr Teil der Seite sind (Manifest-Vergleich). Fremde Dateien (z. B. .well-known
          # für Let's Encrypt) werden nie angefasst.
          # NETCUP_PATH darf mehrere Document Roots enthalten (durch Leerzeichen getrennt).
          for p in $NETCUP_PATH; do
            case "$p" in /*|*..*) echo "::error::NETCUP_PATH muss relativ zum Home-Verzeichnis sein"; exit 1;; esac
            d="${p%/}"
            echo "=== Deploy nach $d"
            ssh netcup "test -d ~/$d" || { echo "::error::Document Root $d nicht gefunden"; exit 1; }
            ssh netcup "cat ~/$d/.deploy-manifest 2>/dev/null || true" > old-manifest
            tar -C _site -czf - . | ssh netcup "tar --no-overwrite-dir -xzf - -C ~/$d"
            LC_ALL=C sort -o old-manifest old-manifest
            LC_ALL=C comm -23 old-manifest _site/.deploy-manifest | grep -v -e '^\.well-known/' -e '\.\.' -e '^/' > stale || true
            if [ -s stale ]; then
              echo "Veraltete Dateien entfernen:"; cat stale
              ssh netcup "cd ~/$d && while IFS= read -r f; do rm -f -- \"\$f\"; done" < stale
              ssh netcup "cd ~/$d && find assets images -mindepth 1 -type d -empty -delete 2>/dev/null || true"
            fi
            ssh netcup "ls -la ~/$d/"
          done
